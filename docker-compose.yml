services:
  mongodb:
    image: mongo:8.3.7
    container_name: mongodb
    volumes:
      - mongo_data:/data/db
    networks:
      - healthcare_network
  app:
    build: .
    container_name: script_migration
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
    volumes:
      - ./healthcare_dataset.csv:/app/healthcare_dataset.csv
    networks:
      - healthcare_network

volumes:
  mongo_data:

networks:
  healthcare_network: